name: precompute-embeddings

# Hourly: embed any new archive campaigns with MiniLM (the same model the browser uses for the
# query) and store int8 vectors via /internal/embeddings, so the public semantic search ships
# precomputed vectors instead of embedding the whole corpus in every visitor's browser. Only
# touches NULL-embedding rows, so it's cheap + idempotent.
#
# WHY IT LIVES IN THIS (public) REPO, not netcore-pulse/trove:
#   trove is a PRIVATE repo on the org's Free plan → GitHub Actions is capped at 2,000 min/month
#   and blocks once that's spent (or a payment method fails). An hourly job would eat that whole
#   quota. Public repos get UNLIMITED free Actions minutes, so the embed job runs here for free
#   and leaves trove's quota for CI. The script is mirrored from trove/cf-archive/scripts.
#
# Secrets: reuses this repo's existing TROVE_INTERNAL_API_TOKEN secret + TROVE_ARCHIVE_URL var
# (same ones subscribe.yml uses). `schedule` runs only on the default branch and is never
# triggered by forks/PRs, so the token is not exposed. Manual runs via workflow_dispatch.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

# NOTE: GitHub disables scheduled workflows after 60 days with no repo activity. The fleet's
# subscribe runs keep this repo active; if it ever goes quiet, a manual dispatch (or any commit)
# re-arms the cron.

permissions:
  contents: read

concurrency:
  group: precompute-embeddings
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TROVE_INTERNAL_API_TOKEN: ${{ secrets.TROVE_INTERNAL_API_TOKEN }}
      ARCHIVE_URL: ${{ vars.TROVE_ARCHIVE_URL || 'https://trove.livingemails.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install transformers.js (embedding model runtime)
        run: npm i --no-save @xenova/transformers@2.17.2
      - name: Precompute embeddings
        run: node scripts/precompute-embeddings.mjs
